<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#22C55E',
            secondary: '#F3F4F6',
          },
        },
      },
    };
  </script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
    <a href="index.html" class="text-sm text-gray-500 hover:underline mb-4 inline-block">← Back to Home</a>
    <h2 class="text-2xl font-bold mb-6 text-center">Register</h2>

    <!-- Registration Form -->
    <form action="/auth/register" method="post">
      <div class="mb-4">
        <label class="block mb-1 text-gray-600">Full Name</label>
        <input type="text" name="fullname" class="w-full border border-gray-300 p-3 rounded" placeholder="Enter your name" required />
      </div>
      <div class="mb-4">
        <label class="block mb-1 text-gray-600">Email</label>
        <input type="email" name="email" class="w-full border border-gray-300 p-3 rounded" placeholder="Enter your email" required />
      </div>
      <div class="mb-4">
        <label class="block mb-1 text-gray-600">Password</label>
        <input type="password" name="password" class="w-full border border-gray-300 p-3 rounded" placeholder="Create a password" required />
      </div>
      <button class="w-full bg-green-600 text-white p-3 rounded hover:bg-green-700 transition">Register</button>
      <p class="mt-4 text-center text-sm">
        Already have an account?
        <a href="login.html" class="text-green-600 hover:underline">Login</a>
      </p>
    </form>

    <!-- Divider -->
    <div class="mt-6 flex items-center justify-center">
      <hr class="w-full border-gray-300">
      <span class="px-3 text-gray-400 text-sm">or</span>
      <hr class="w-full border-gray-300">
    </div>

    <!-- Google Register Button -->
    <div class="mt-6">
      <a href="/auth/google"
         class="flex items-center justify-center gap-3 w-full bg-white text-gray-800 font-medium py-3 px-6 border border-gray-300 rounded-xl shadow hover:shadow-md transition duration-300">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="Google logo" />
        <span>Register with Google</span>
      </a>
      <p class="mt-2 text-xs text-center text-gray-500">
        You can use your Google account to sign in or register quickly.
      </p>
    </div>
  </div>
</body>
</html>
