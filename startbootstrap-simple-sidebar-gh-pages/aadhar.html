<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aadhaar Services</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
      <a href="javascript:history.back()" class="btn btn-outline-dark mb-3">
  ← Back
</a>
    <h2>Aadhaar Card Correction</h2>

    <!-- ✅ Aadhaar Correction Form (Always Visible) -->
    <form id="correctionForm" class="mt-4"
          action="/submit-service/aadhar-correction"
          method="post"
          enctype="multipart/form-data"
          autocomplete="off">
      <h5 class="mb-3">Correction Request Form</h5>

      <div class="mb-3">
        <label class="form-label">Aadhaar Number</label>
        <input type="text" class="form-control" name="aadharNumber" placeholder="Enter your Aadhaar number" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" name="fullName" placeholder="Enter your name as in aadhar-card" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Mobile Number</label>
        <input type="text" class="form-control" name="mobile" placeholder="Enter your mobile number linked to aadhar" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Field to Correct</label>
        <select class="form-select" name="fieldToCorrect" required>
          <option value="">Select field</option>
          <option value="address">Address</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Correct Information</label>
        <input type="text" class="form-control" name="correctValue" placeholder="Enter the correct info" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Upload old Aadhaar Card</label>
        <input type="file" class="form-control" id="oldAadharFile" name="oldAadharFile" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Upload passport size photo</label>
        <input type="file" class="form-control" id="photoFile" name="photoFile" required>
      </div>

      <button type="submit" class="btn btn-warning">Submit Correction Request</button>
      <div class="mt-3 text-success fw-bold d-none" id="correctionSuccess">✅ Correction Request Submitted!</div>
    </form>
  </div>

  <!-- ✅ Success Logic -->
  <script>
    document.getElementById("correctionForm").addEventListener("submit", function(e) {
      // The following is only for local instant feedback, can be removed if backend redirects/gives feedback.
      const oldAadharFile = document.getElementById("oldAadharFile");
      const photoFile = document.getElementById("photoFile");
      if (!oldAadharFile.files.length || !photoFile.files.length) {
        e.preventDefault();
        alert("Please upload both your old Aadhaar card and passport size photo.");
        return;
      }
      // Uncomment below lines only if you want local success message instead of backend redirect
      // e.preventDefault();
      // document.getElementById("correctionSuccess").classList.remove("d-none");
      // this.reset();
    });
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
   <!-- ✅ Footer -->
      <footer class="text-center py-3 bg-white border-top">
        <small>&copy; 2025 Janasava | Operated by Corepair. All Rights Reserved.</small><br>
        <a href="privacy.html" class="text-decoration-none me-2">Privacy Policy</a> |
        <a href="terms.html" class="text-decoration-none ms-2">Terms & Conditions</a>
      </footer>
    </div>
  </div>
</body>
</html>
