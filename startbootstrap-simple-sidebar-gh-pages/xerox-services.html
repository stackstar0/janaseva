<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Xerox Services</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container mt-5">
      <a href="javascript:history.back()" class="btn btn-outline-dark mb-3">
        ← Back
      </a>
    <h2 class="mb-4"><i class="fa-solid fa-copy text-primary me-2"></i>Xerox Services</h2>

    <form id="xeroxForm" enctype="multipart/form-data" autocomplete="off">
      <div class="mb-3">
        <label class="form-label">Your Name</label>
        <input type="text" class="form-control" id="userName" name="userName" placeholder="Enter your name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Mobile Number</label>
        <input type="tel" class="form-control" id="mobileNumber" name="mobileNumber" placeholder="Enter your mobile number" pattern="[0-9]{10}" maxlength="10" required>
        <div class="form-text">Enter a 10-digit mobile number.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Upload Documents for Xerox</label>
        <input type="file" class="form-control" id="xeroxFiles" name="xeroxFiles" multiple required>
        <div class="form-text">Select one or more documents. Then enter how many copies you want for each and choose Xerox type.</div>
      </div>

      <div id="fileListContainer" class="mb-4"></div>

      <button type="submit" class="btn btn-primary">Upload for Xerox</button>

      <div class="mt-3 text-success fw-bold d-none" id="successMessage">
        ✅ Documents uploaded successfully for Xerox!
      </div>
    </form>
  </div>

  <!-- JavaScript -->
  <script>
    const fileInput = document.getElementById("xeroxFiles");
    const fileListContainer = document.getElementById("fileListContainer");
    const successMessage = document.getElementById("successMessage");

    fileInput.addEventListener("change", () => {
      fileListContainer.innerHTML = "";

      const files = Array.from(fileInput.files);
      files.forEach((file, index) => {
        const wrapper = document.createElement("div");
        wrapper.className = "border rounded p-3 mb-3";

        const fileRow = document.createElement("div");
        fileRow.className = "input-group mb-2";

        const fileName = document.createElement("span");
        fileName.className = "input-group-text bg-secondary text-white";
        fileName.textContent = file.name;

        const quantityInput = document.createElement("input");
        quantityInput.type = "number";
        quantityInput.min = "1";
        quantityInput.placeholder = "No. of copies";
        quantityInput.className = "form-control";
        quantityInput.name = `copies-${index}`;
        quantityInput.required = true;

        fileRow.appendChild(fileName);
        fileRow.appendChild(quantityInput);
        wrapper.appendChild(fileRow);

        // Xerox type (radio buttons)
        const typeLabel = document.createElement("label");
        typeLabel.className = "form-label";
        typeLabel.textContent = "Choose Xerox Type:";
        wrapper.appendChild(typeLabel);

        const bwOption = document.createElement("div");
        bwOption.className = "form-check form-check-inline";
        const bwInput = document.createElement("input");
        bwInput.className = "form-check-input";
        bwInput.type = "radio";
        bwInput.name = `xeroxType-${index}`;
        bwInput.id = `bw-${index}`;
        bwInput.value = "blackwhite";
        bwInput.checked = true;
        const bwLabel = document.createElement("label");
        bwLabel.className = "form-check-label";
        bwLabel.htmlFor = `bw-${index}`;
        bwLabel.textContent = "Black & White";
        bwOption.appendChild(bwInput);
        bwOption.appendChild(bwLabel);

        const colorOption = document.createElement("div");
        colorOption.className = "form-check form-check-inline";
        const colorInput = document.createElement("input");
        colorInput.className = "form-check-input";
        colorInput.type = "radio";
        colorInput.name = `xeroxType-${index}`;
        colorInput.id = `color-${index}`;
        colorInput.value = "color";
        const colorLabel = document.createElement("label");
        colorLabel.className = "form-check-label";
        colorLabel.htmlFor = `color-${index}`;
        colorLabel.textContent = "Color";
        colorOption.appendChild(colorInput);
        colorOption.appendChild(colorLabel);

        wrapper.appendChild(bwOption);
        wrapper.appendChild(colorOption);
        fileListContainer.appendChild(wrapper);
      });
    });

    document.getElementById("xeroxForm").addEventListener("submit", function (e) {
      e.preventDefault();

      if (fileInput.files.length === 0) {
        alert("❗ Please select at least one file.");
        return;
      }

      const inputs = fileListContainer.querySelectorAll("input[type='number']");
      for (const input of inputs) {
        if (!input.value || input.value <= 0) {
          alert("❗ Please enter valid quantity for all documents.");
          return;
        }
      }

      // Gather form data for AJAX
      const formData = new FormData();
      formData.append('userName', document.getElementById('userName').value);
      formData.append('mobileNumber', document.getElementById('mobileNumber').value);

      Array.from(fileInput.files).forEach((file, idx) => {
        formData.append('xeroxFiles', file); // 'xeroxFiles' as field name
        // Copies
        const copies = document.querySelector(`[name="copies-${idx}"]`).value;
        formData.append(`copies-${idx}`, copies);
        // Xerox Type
        const type = document.querySelector(`[name="xeroxType-${idx}"]:checked`).value;
        formData.append(`xeroxType-${idx}`, type);
      });

      fetch('/submit-service/xerox', {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if(data.success) {
          successMessage.classList.remove("d-none");
          document.getElementById("xeroxForm").reset();
          fileListContainer.innerHTML = "";
        } else {
          alert(data.message || "Submission failed.");
        }
      })
      .catch(() => alert("Submission failed!"));
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ✅ Footer -->
  <footer class="text-center py-3 bg-white border-top mt-5">
    <small>&copy; 2025 Janasava | Operated by Corepair. All Rights Reserved.</small><br>
    <a href="privacy.html" class="text-decoration-none me-2">Privacy Policy</a> |
    <a href="terms.html" class="text-decoration-none ms-2">Terms & Conditions</a>
  </footer>
</body>
</html>
