<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PAN Card Services</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .content-wrapper {
      flex: 1;
    }
  </style>
  <script>
    function showForm(option) {
      document.getElementById('newPanForm').style.display = option === 'new' ? 'block' : 'none';
      document.getElementById('missingPanForm').style.display = option === 'missing' ? 'block' : 'none';
      document.getElementById('correctionPanForm').style.display = option === 'correction' ? 'block' : 'none';
    }
  </script>
</head>
<body class="bg-light">
  <div class="container mt-4 content-wrapper">
    <a href="javascript:history.back()" class="btn btn-outline-dark mb-3">← Back</a>
    <h2>PAN Card Services</h2>

    <div class="mb-4">
      <label class="form-label">Select Service</label>
      <select class="form-select" onchange="showForm(this.value)">
        <option selected disabled>Choose an option</option>
        <option value="new">New PAN Application</option>
        <option value="missing">Missing PAN</option>
        <option value="correction">Correction in PAN</option>
      </select>
    </div>

    <!-- ✅ New PAN Application Form -->
    <form id="newPanForm" class="mt-4" style="display:none;" action="/submit-service/pan-new" method="post" enctype="multipart/form-data">
      <h5>New PAN Application</h5>
      <div class="mb-3"><label class="form-label">Full Name</label><input type="text" name="fullName" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Date of Birth</label><input type="date" name="dob" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Mobile Number</label><input type="tel" name="mobile" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Father’s Name</label><input type="text" name="fatherName" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Upload Aadhar Card</label><input type="file" name="aadharFile" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Upload Voter ID</label><input type="file" name="voterIdFile" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Upload Passport Size Photo</label><input type="file" name="photoFile" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Upload Signature</label><input type="file" name="signatureFile" class="form-control" required></div>
      <button type="submit" class="btn btn-success">Submit PAN Application</button>
      <div id="messageNew" class="mt-3 text-success fw-bold"></div>
    </form>

    <!-- ✅ Missing PAN Form -->
    <form id="missingPanForm" class="mt-4" style="display:none;" action="/submit-service/pan-missing" method="post" enctype="multipart/form-data">
      <h5>Missing PAN Request</h5>
      <div class="mb-3"><label class="form-label">Full Name (as per PAN)</label><input type="text" name="fullName" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Mobile Number</label><input type="tel" name="mobile" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Upload Aadhar Card</label><input type="file" name="aadharFile" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Upload Passport Size Photo</label><input type="file" name="photoFile" class="form-control" required></div>
      <button type="submit" class="btn btn-primary">Submit Missing PAN Request</button>
      <div id="messageMissing" class="mt-3 text-success fw-bold"></div>
    </form>

    <!-- ✅ Correction Form -->
    <form id="correctionPanForm" class="mt-4" style="display:none;" action="/submit-service/pan-correction" method="post" enctype="multipart/form-data">
      <h5>Correction in PAN</h5>
      <div class="mb-3"><label class="form-label">Old PAN Number</label><input type="text" name="oldPan" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Full Name (as per old PAN)</label><input type="text" name="fullName" class="form-control" required></div>
      <div class="mb-3">
        <label class="form-label">Select Field to Correct</label>
        <select name="fieldToCorrect" class="form-select" required>
          <option value="">Choose</option>
          <option value="name">Name</option>
          <option value="dob">Date of Birth</option>
          <option value="father">Father’s Name</option>
          <option value="mobile">Mobile Number</option>
        </select>
      </div>
      <div class="mb-3"><label class="form-label">Enter Correct Value</label><input type="text" name="correctValue" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Upload old pan-card</label><input type="file" name="oldPanFile" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Upload aadhar card</label><input type="file" name="aadharFile" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Upload Passport size photo</label><input type="file" name="photoFile" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Upload Signature</label><input type="file" name="signatureFile" class="form-control" required></div>
      <button type="submit" class="btn btn-warning">Submit Correction</button>
      <div id="messageCorrection" class="mt-3 text-success fw-bold"></div>
    </form>
  </div>

  <footer class="text-center py-3 bg-white border-top">
    <small>&copy; 2025 Janasava | Operated by Corepair. All Rights Reserved.</small><br>
    <a href="privacy.html" class="text-decoration-none me-2">Privacy Policy</a> |
    <a href="terms.html" class="text-decoration-none ms-2">Terms & Conditions</a>
  </footer>
</body>
</html>
