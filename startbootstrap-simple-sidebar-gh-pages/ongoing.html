<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ongoing Requests</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    .files-list {
      margin-top: 10px;
    }
    .file-link {
      display: inline-block;
      margin-right: 10px;
      padding: 5px 10px;
      background-color: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      text-decoration: none;
      color: #495057;
      font-size: 0.875rem;
    }
    .file-link:hover {
      background-color: #e9ecef;
      text-decoration: none;
      color: #495057;
    }
    .status-dropdown {
      min-width: 120px;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <a href="admin.html" class="btn btn-outline-dark mb-3">
      ← Back to Admin
    </a>
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-info text-white">
        <h5 class="mb-0">🔧 Ongoing Requests</h5>
      </div>
    </div>

    <div id="requests-container">
      <div class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p>Loading ongoing requests...</p>
      </div>
    </div>
  </div>

  <script>
    // Load ongoing requests
    fetch('/admin-requests/ongoing')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('requests-container');
        
        if (data.requests.length === 0) {
          container.innerHTML = `
            <div class="text-center text-muted">
              <h5>No ongoing requests found</h5>
              <p>No requests are currently being processed.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = data.requests.map(request => `
          <div class="card mb-3 shadow-sm">
            <div class="card-body">
              <div class="row">
                <div class="col-md-8">
                  <h5 class="card-title mb-1">${formatServiceType(request.serviceType)}</h5>
                  <p class="mb-1 text-muted">
                    ${getUserInfo(request)} | Request ID: #${request._id.slice(-6)}
                  </p>
                  <p class="mb-2"><strong>Status:</strong> <span class="badge bg-info">${request.status}</span></p>
                  <p class="mb-1"><strong>Created:</strong> ${new Date(request.createdAt).toLocaleDateString()}</p>
                  <p class="mb-1"><strong>Type:</strong> ${request.requestType}</p>
                  
                  ${request.formData ? `
                    <div class="mb-2">
                      <strong>Details:</strong><br>
                      <small class="text-muted">
                        ${Object.entries(request.formData).map(([key, value]) => 
                          `${key}: ${value}`
                        ).join(', ')}
                      </small>
                    </div>
                  ` : ''}
                  
                  ${request.files && request.files.length > 0 ? `
                    <div class="files-list">
                      <strong>Files:</strong><br>
                      ${request.files.map(file => `
                        <a href="/files/${file.filename}" target="_blank" class="file-link">
                          📎 ${file.originalname || file.filename}
                        </a>
                      `).join('')}
                    </div>
                  ` : ''}
                </div>
                <div class="col-md-4 text-end">
                  <select class="form-select status-dropdown mb-2" onchange="updateStatus('${request._id}', this.value, '${request.requestType}')">
                    <option value="pending" ${request.status === 'pending' ? 'selected' : ''}>Pending</option>
                    <option value="ongoing" ${request.status === 'ongoing' ? 'selected' : ''}>Ongoing</option>
                    <option value="completed" ${request.status === 'completed' ? 'selected' : ''}>Completed</option>
                  </select>
                  <button class="btn btn-sm btn-outline-primary" onclick="viewDetails('${request._id}')">View Details</button>
                </div>
              </div>
            </div>
          </div>
        `).join('');
      })
      .catch(error => {
        console.error('Error loading requests:', error);
        document.getElementById('requests-container').innerHTML = `
          <div class="alert alert-danger">
            <h5>Error Loading Requests</h5>
            <p>Failed to load ongoing requests. Please try again.</p>
          </div>
        `;
      });

    function formatServiceType(serviceType) {
      const types = {
        'pan-new': 'New PAN Card',
        'pan-missing': 'Missing PAN Card',
        'pan-correction': 'PAN Card Correction',
        'aadhar-correction': 'Aadhaar Card Correction',
        'xerox': 'Xerox Service',
        'certificate-income': 'Income Certificate',
        'certificate-caste': 'Caste Certificate'
      };
      return types[serviceType] || serviceType.replace('-', ' ').replace(/\b\w/g, l => l.toUpperCase());
    }

    function getUserInfo(request) {
      if (request.user) {
        return `${request.user.fullname} | ${request.user.email}`;
      } else if (request.formData) {
        const name = request.formData.fullName || request.formData.userName || 'Guest User';
        const contact = request.formData.mobileNumber || request.formData.mobile || '';
        return contact ? `${name} | ${contact}` : name;
      }
      return 'Guest User';
    }

    function updateStatus(requestId, newStatus, requestType) {
      fetch('/update-request-status', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          requestId: requestId,
          status: newStatus,
          requestType: requestType
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          // Reload the page to show updated requests
          location.reload();
        } else {
          alert('Failed to update status: ' + (data.error || 'Unknown error'));
        }
      })
      .catch(error => {
        console.error('Error updating status:', error);
        alert('Failed to update status. Please try again.');
      });
    }

    function viewDetails(requestId) {
      // Fetch request details and show in modal
      fetch(`/admin-request-detail/${requestId}`)
        .then(response => response.json())
        .then(data => {
          if (data.request) {
            showRequestModal(data.request);
          } else {
            alert('Failed to load request details: ' + (data.error || 'Unknown error'));
          }
        })
        .catch(error => {
          console.error('Error fetching request details:', error);
          alert('Failed to load request details. Please try again.');
        });
    }

    function showRequestModal(request) {
      // Create modal HTML
      const modalHTML = `
        <div class="modal fade" id="requestModal" tabindex="-1" aria-labelledby="requestModalLabel" aria-hidden="true">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="requestModalLabel">Request Details - #${request._id.slice(-6)}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <div class="row">
                  <div class="col-md-6">
                    <h6>Basic Information</h6>
                    <p><strong>Service Type:</strong> ${formatServiceType(request.serviceType)}</p>
                    <p><strong>Request Type:</strong> ${request.requestType}</p>
                    <p><strong>Status:</strong> <span class="badge ${getStatusBadgeClass(request.status)}">${request.status}</span></p>
                    <p><strong>Created:</strong> ${new Date(request.createdAt).toLocaleString()}</p>
                    ${request.user ? `
                      <p><strong>User:</strong> ${request.user.fullname}</p>
                      <p><strong>Email:</strong> ${request.user.email}</p>
                    ` : ''}
                  </div>
                  <div class="col-md-6">
                    <h6>Form Data</h6>
                    ${request.formData ? Object.entries(request.formData).map(([key, value]) => 
                      `<p><strong>${key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase())}:</strong> ${value}</p>`
                    ).join('') : '<p class="text-muted">No form data available</p>'}
                  </div>
                </div>
                <div class="row mt-3">
                  <div class="col-12">
                    <h6>Uploaded Files</h6>
                    ${request.files && request.files.length > 0 ? `
                      <div class="row">
                        ${request.files.map(file => `
                          <div class="col-md-6 mb-3">
                            <div class="card">
                              <div class="card-body p-2">
                                <h6 class="card-title">${file.originalname || file.filename}</h6>
                                <a href="/files/${file.filename}" target="_blank" class="btn btn-sm btn-outline-primary">
                                  View File
                                </a>
                              </div>
                            </div>
                          </div>
                        `).join('')}
                      </div>
                    ` : '<p class="text-muted">No files uploaded</p>'}
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              </div>
            </div>
          </div>
        </div>
      `;
      
      // Remove existing modal if any
      const existingModal = document.getElementById('requestModal');
      if (existingModal) {
        existingModal.remove();
      }
      
      // Add modal to body
      document.body.insertAdjacentHTML('beforeend', modalHTML);
      
      // Show modal
      const modal = new bootstrap.Modal(document.getElementById('requestModal'));
      modal.show();
      
      // Clean up modal after it's hidden
      document.getElementById('requestModal').addEventListener('hidden.bs.modal', function() {
        this.remove();
      });
    }

    function getStatusBadgeClass(status) {
      switch(status) {
        case 'completed': return 'bg-success';
        case 'ongoing': return 'bg-warning text-dark';
        case 'pending': return 'bg-secondary';
        default: return 'bg-secondary';
      }
    }
  </script>
</body>
</html>
