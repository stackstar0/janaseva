<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Income/Caste Certificate Services</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    function toggleCasteCategory(select) {
      const casteCategoryDiv = document.getElementById('casteCategoryDiv');
      casteCategoryDiv.style.display = select.value === 'caste' ? 'block' : 'none';
    }
  </script>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <a href="javascript:history.back()" class="btn btn-outline-dark mb-3">
      ← Back
    </a>
    <h2>Income/Caste Certificate Services</h2>
    <form id="newApplicationForm" class="mt-4" enctype="multipart/form-data" autocomplete="off">
      <h5>New Application</h5>
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" id="fullName" name="fullName" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Mobile Number</label>
        <input type="tel" class="form-control" id="mobileNumber" name="mobileNumber" pattern="[0-9]{10}" maxlength="10" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Certificate Type</label>
        <select class="form-select" id="certificateType" name="certificateType" required onchange="toggleCasteCategory(this)">
          <option value="">Select certificate</option>
          <option value="income">Income Certificate</option>
          <option value="caste">Caste Certificate</option>
        </select>
      </div>
      <!-- Caste Category Dropdown -->
      <div class="mb-3" id="casteCategoryDiv" style="display: none;">
        <label class="form-label">Caste Category</label>
        <select class="form-select" id="casteCategory" name="casteCategory">
          <option value="">Select Caste Category</option>
          <option value="general">General</option>
          <option value="obc">OBC</option>
          <option value="sc">SC</option>
          <option value="st">ST</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea class="form-control" id="address" name="address" rows="3" required></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Upload Aadhar card</label>
        <input type="file" class="form-control" id="doc1" name="aadharCard" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Upload Study Certificate</label>
        <input type="file" class="form-control" id="doc2" name="studyCertificate" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Upload passport size photo</label>
        <input type="file" class="form-control" id="doc3" name="photo" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Upload Signature</label>
        <input type="file" class="form-control" id="doc4" name="signature" required>
      </div>
      <button type="submit" class="btn btn-success">Submit New Application</button>
      <div class="mt-3 text-success fw-bold d-none" id="newSuccess">✅ Application Submitted!</div>
    </form>
  </div>
  <script>
    document.getElementById("newApplicationForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const filesUploaded = ['doc1', 'doc2', 'doc3', 'doc4'].every(id => document.getElementById(id).files.length > 0);

      if (!filesUploaded) {
        alert("❗ Please upload all required documents.");
        return;
      }

      // Gather form data for backend submission
      const formData = new FormData();
      formData.append('fullName', document.getElementById('fullName').value);
      formData.append('mobileNumber', document.getElementById('mobileNumber').value);
      formData.append('certificateType', document.getElementById('certificateType').value);
      if(document.getElementById('certificateType').value === 'caste') {
        formData.append('casteCategory', document.getElementById('casteCategory').value);
      }
      formData.append('address', document.getElementById('address').value);
      formData.append('aadharCard', document.getElementById('doc1').files[0]);
      formData.append('studyCertificate', document.getElementById('doc2').files[0]);
      formData.append('photo', document.getElementById('doc3').files[0]);
      formData.append('signature', document.getElementById('doc4').files[0]);

      fetch('/submit-service/certificate', {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if(data.success) {
          document.getElementById("newSuccess").classList.remove("d-none");
          document.getElementById("newApplicationForm").reset();
          document.getElementById("casteCategoryDiv").style.display = "none";
        } else {
          alert(data.message || "Submission failed.");
        }
      })
      .catch(() => alert("Submission failed!"));
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
